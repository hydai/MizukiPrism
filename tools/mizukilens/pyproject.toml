[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mizukilens"
version = "0.1.0"
description = "Upstream data collection pipeline for MizukiPrism — scrapes YouTube livestream archives for song timestamp data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scrapetube>=2.6.0",
    "youtube-comment-downloader>=0.1.78",
    "yt-dlp>=2026.3.17",
    "click>=8.3.2",
    "flask>=3.1.3",
    "rich>=15.0.0",
    "textual>=8.2.3",
    "tomli>=2.0.1; python_version < '3.11'",
    "tomli-w>=1.2.0",
    "httpx>=0.28.1",
]

[project.scripts]
mizukilens = "mizukilens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
mizukilens = ["stamp_templates/*.html", "stamp_static/*.css", "stamp_static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
